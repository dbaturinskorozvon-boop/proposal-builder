name: kpbuilder
services:
  app:
    build: /opt/kpbuilder/app
    image: kpbuilder:latest
    container_name: kpbuilder
    restart: unless-stopped
    env_file:
      - /opt/stacks/secrets/kpbuilder.env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # старый сабдомен kpbuilder.skorozvon.ru -> 301 на путь /kpbuilder
      - traefik.http.middlewares.kpb-path-redirect.redirectregex.regex=^https://kpbuilder\.skorozvon\.ru(/.*)?$$
      - traefik.http.middlewares.kpb-path-redirect.redirectregex.replacement=https://lead.skorozvon.ru/kpbuilder$$1
      - traefik.http.middlewares.kpb-path-redirect.redirectregex.permanent=true
      - traefik.http.routers.kpb-sub.rule=Host(`kpbuilder.skorozvon.ru`)
      - traefik.http.routers.kpb-sub.entrypoints=websecure
      - traefik.http.routers.kpb-sub.tls.certresolver=le
      - traefik.http.routers.kpb-sub.middlewares=kpb-path-redirect
      # legacy .isite.app -> тот же путь
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.regex=^https://kpbuilder\.skorozvon\.isite\.app(/.*)?$$
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.replacement=https://lead.skorozvon.ru/kpbuilder$$1
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.permanent=true
      - traefik.http.routers.kpb-old.rule=Host(`kpbuilder.skorozvon.isite.app`)
      - traefik.http.routers.kpb-old.entrypoints=websecure
      - traefik.http.routers.kpb-old.tls.certresolver=le
      - traefik.http.routers.kpb-old.middlewares=kpb-old-redirect
networks:
  proxy:
    external: true
