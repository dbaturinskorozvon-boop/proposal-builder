name: kpbuilder
services:
  app:
    build: /opt/kpbuilder/app
    image: kpbuilder:latest
    container_name: kpbuilder
    restart: unless-stopped
    env_file:
      - /opt/stacks/secrets/kpbuilder.env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.kpb.rule=Host(`kpbuilder.skorozvon.ru`)
      - traefik.http.routers.kpb.entrypoints=websecure
      - traefik.http.routers.kpb.tls.certresolver=le
      - traefik.http.services.kpb.loadbalancer.server.port=8000
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.regex=^https://kpbuilder\.skorozvon\.isite\.app(/.*)?$
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.replacement=https://kpbuilder.skorozvon.ru$$1
      - traefik.http.middlewares.kpb-old-redirect.redirectregex.permanent=true
      - traefik.http.routers.kpb-old.rule=Host(`kpbuilder.skorozvon.isite.app`)
      - traefik.http.routers.kpb-old.entrypoints=websecure
      - traefik.http.routers.kpb-old.tls.certresolver=le
      - traefik.http.routers.kpb-old.middlewares=kpb-old-redirect
networks:
  proxy:
    external: true