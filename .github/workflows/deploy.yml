name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kpbuilder
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean non-deploy files
        run: rm -rf .git .github v1 .DS_Store

      - name: Sync app source to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -rltgoDzvO --delete --exclude node_modules \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$USER@$HOST:/opt/kpbuilder/app/"

      - name: Rebuild and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            docker compose -p kpbuilder -f /opt/stacks/kpbuilder-stack.yml up -d --build
            sleep 5
            docker compose -p kpbuilder ps
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
            echo "health: $code"
            [ "$code" = "302" ] || [ "$code" = "200" ]
