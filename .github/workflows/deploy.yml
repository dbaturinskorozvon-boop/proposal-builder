name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kpbuilder
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean non-deploy files
        run: rm -rf .git .github v1 .DS_Store

      - name: Sync app source to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete --exclude node_modules"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: "/opt/kpbuilder/app/"

      - name: Rebuild and restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            docker compose -p kpbuilder -f /opt/stacks/kpbuilder-stack.yml up -d --build
            sleep 5
            docker compose -p kpbuilder ps
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
            echo "health: $code"
            [ "$code" = "302" ] || [ "$code" = "200" ]